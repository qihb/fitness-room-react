name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Vite+ 官方 action：装 vp、按 devEngines 选 Node 24、缓存依赖并自动执行 vp install。
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: 24
          cache: true

      - name: 代码校验（格式 + lint + 类型检查）
        run: vp check

      - name: 单元测试
        run: vp test

      - name: 安装 Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # webServer 配置会在 CI 中自动拉起 `vp dev`。
      - name: E2E 测试
        run: pnpm e2e

      - name: 上传 E2E 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
